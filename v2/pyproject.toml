[project]
name = "gh-recs-v2"
version = "2.0.0.dev0"
description = "GitHub interaction graph and embeddings, rebuilt on GH Archive"
# Capped below 3.14: gensim has no wheels for it yet.
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
# Kept out of the base install: only needed from M2 onwards.
# The random walks are generated in walk.py rather than by a node2vec library:
# pecanpy, the fast option, pins numba 0.53 and will not build past Python 3.9.
embed = [
    "gensim>=4.4",
]

[tool.uv]
package = false
